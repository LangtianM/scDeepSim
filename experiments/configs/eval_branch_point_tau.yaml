seed: 42

data:
  n_genes: 2000
  celltype_key: clusters
  start_state: Ductal
  waypoint_state: Ngn3 high EP
  terminal_state_1: Beta
  terminal_state_2: Alpha

vae:
  latent_dim: 64
  enc_hidden: [512, 256]
  dec_hidden: [256, 512]
  input_dropout: 0.1
  beta: 1.0
  beta_warmup_epochs: 10
  zero_inflated: true
  sup_head_hidden: 64
  max_epochs: 150
  batch_size: 128

supervision:
  celltype_weight: 3.0
  celltype_latent_dims: 16

generation:
  tau_values: [0.0, 0.25, 0.5, 0.75, 1.0]
  t_values_count: 21
  n_samples_per_t: 100

hydra:
  run:
    dir: experiments/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_branch_point_tau
