seed: 42

paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_path: ${paths.root_dir}/data/scIBPancreas.h5ad

data:
  n_cells: 10000
  n_genes: 2000
  batch_key: tech

split:
  heldout_batch: null
  reference_batch: null
  calibration_fraction: 0.25
  min_cells_per_batch: 200

vae:
  latent_dim: 128
  enc_hidden: [512, 256]
  dec_hidden: [256, 512]
  input_dropout: 0.1
  beta: 1.0
  beta_warmup_epochs: 10
  zero_inflated: true
  sup_head_hidden: 64
  max_epochs: 100
  batch_size: 256

supervision:
  batch_weight: 5.0
  batch_latent_dims: 16

diffusion:
  objective: pred_v
  hidden_dims: [256, 256, 128]
  beta_schedule: linear
  dropout: 0.05
  lr: 1.0e-4
  weight_decay: 1.0e-4
  use_ema: true
  ema_decay: 0.999
  guidance_dropout: 0.1
  guidance_scale: 1.5
  timesteps: 1000
  sampling_steps: 1000
  epochs: 100
  batch_size: 256

generation:
  generator: diffusion
  direction_method: gaussian_ot
  alpha: 1.0
  encode_batch_size: 1024
  decode_batch_size: 1024
  progress: true

evaluation:
  lisi_k: 30
  rf_n_estimators: 100
  rf_max_depth: null
  rf_pca_components: null

hydra:
  run:
    dir: ${paths.root_dir}/experiments/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_heldout_batch_validation
