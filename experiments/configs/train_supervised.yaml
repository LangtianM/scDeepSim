seed: 42

paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_path: ${paths.root_dir}/data/tabula_muris/all.h5ad
  checkpoint_dir: ${paths.root_dir}/experiments/outputs/checkpoints/test_supervised/tn_vae_1ctdim
  log_dir: ${paths.root_dir}/experiments/outputs/lightning_logs/test_supervised/tn_vae_1ctdim

data:
  n_cells: 10000
  n_genes: 2000

vae:
  latent_dim: 128
  enc_hidden: [512, 256]
  input_dropout: 0.1
  beta: 1.0
  beta_warmup_epochs: 10
  zero_inflated: true
  celltype_latent_dims: 1
  sup_head_hidden: 64
  max_epochs: 100
  batch_size: 256

sweep:
  supervision_weights: [1.0, 2.0, 3.0, 5.0, 7.0]

eval:
  rf_n_estimators: 100
  rf_max_depth: 10
  n_neighbors: 10
