seed: 42

paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_path: ${paths.root_dir}/data/tabula_muris/all.h5ad
  output_dir: ${paths.root_dir}/experiments/outputs/sim_benchmarking_results

data:
  dataset: tabula_muris
  n_cells: 10000
  n_genes: [1000, 2000, 4000, 8000]

simulators: [negbin_copula, ae_diffusion, scvi_posterior, scvi_prior]

ae:
  enc_hidden: [512, 512, 512]
  max_epochs: 100
  early_stopping_patience: 10

diffusion:
  max_epochs: 200
  use_ema: true
  ema_decay: 0.999

negbin_copula:
  mean_formula: "~ celltype"
  max_epochs: 300
  top_k: 100
