seed: 42

paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_path: ${paths.root_dir}/data/tabula_muris/all.h5ad

data:
  n_cells: 5000
  n_genes: 1000
  celltype_key: celltype
  min_genes: 10
  min_cells: 2

vae:
  latent_dim: 128
  enc_hidden: [512, 256]
  dec_hidden: [256, 512]
  input_dropout: 0.1
  beta: 1.0
  beta_warmup_epochs: 10
  zero_inflated: true
  epochs: 100
  batch_size: 256

diffusion:
  objective: pred_v
  hidden_dims: [256, 256, 128]
  beta_schedule: linear
  dropout: 0.05
  lr: 1.0e-4
  weight_decay: 1.0e-4
  use_ema: true
  ema_decay: 0.999
  guidance_dropout: 0.1
  guidance_scale: 1.5
  timesteps: 1000
  sampling_steps: 1000
  epochs: 100

eval:
  n_samples: ${data.n_cells}
  discriminability_method: rf
  n_neighbors: 10
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  umap_share_axes: true
  umap_equal_aspect: false
  save_intermediates: true

scdesign3:
  conda_env: lightning
  n_cores: 2
  celltype: ${data.celltype_key}
  mu_formula: celltype
  sigma_formula: "1"
  family_use: nb
  corr_formula: celltype
  copula: gaussian
  # Use "all" for all genes, or an integer to use the top raw-count-variance
  # genes in the copula model.
  copula_genes: all
  usebam: false
  if_sparse: false
  fastmvn: false
  DT: true
  pseudo_obs: false
  nonzerovar: false
  parallelization: mcmapply

hydra:
  run:
    dir: ${paths.root_dir}/experiments/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_simulation_quality_scdesign3
