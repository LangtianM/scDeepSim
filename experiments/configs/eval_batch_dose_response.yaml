seed: 42

run:
  seeds: [42, 43, 44]
  resume_dir: null

paths:
  root_dir: ${oc.env:PROJECT_ROOT}

inputs:
  vae_run_dir: ???

diffusion:
  objective: pred_v
  hidden_dims: [512, 256, 256, 128]
  beta_schedule: cosine
  dropout: 0.05
  lr: 1.0e-4
  weight_decay: 1.0e-4
  use_ema: true
  ema_decay: 0.999
  guidance_dropout: 0.1
  guidance_scale: 1.5
  timesteps: 1000
  sampling_steps: 1000
  max_epochs: 200
  batch_size: 256

generation:
  source_batch: inDrop3
  target_batch: smartseq2
  celltypes: [acinar, activated_stellate, alpha, beta, delta, ductal]
  cells_per_type: 500
  direction_seed: 42
  direction_method: whitening_recoloring
  covariance_ridge: 1.0e-6
  sampling_batch_size: 500
  decode_batch_size: 1024

evaluation:
  alpha_values: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0]
  lisi_k: 30
  pca_components: 30
  rf_seed: 42

training:
  accelerator: auto
  num_threads: 4

hydra:
  run:
    dir: ${paths.root_dir}/experiments/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_batch_dose_response
