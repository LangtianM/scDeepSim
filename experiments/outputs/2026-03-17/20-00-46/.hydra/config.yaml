seed: 42
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_path: ${paths.root_dir}/data/tabula_muris/all.h5ad
  checkpoint_dir: ${paths.root_dir}/experiments/outputs/checkpoints/vae_diffusion
  log_dir: ${paths.root_dir}/experiments/outputs/lightning_logs/vae_diffusion
data:
  n_cells: 10000
  n_genes: 2000
vae:
  latent_dim: 128
  enc_hidden:
  - 512
  - 256
  dec_hidden:
  - 256
  - 512
  input_dropout: 0.1
  beta: 1.0
  beta_warmup_epochs: 10
  zero_inflated: true
  epochs: 100
  batch_size: 256
diffusion:
  objective: pred_v
  hidden_dims:
  - 256
  - 256
  - 128
  beta_schedule: linear
  dropout: 0.05
  lr: 0.0001
  use_ema: true
  ema_decay: 0.999
  guidance_dropout: 0.1
  guidance_scale: 1.5
  timesteps: 1000
  sampling_steps: 1000
  epochs: 100
eval:
  n_samples: 10000
  n_neighbors: 10
  discriminability_method: knn
