name: lightning
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy=2.3.0
  - scipy
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - scanpy=1.11.5
  - anndata=0.12.6
  - scikit-misc=0.5.2
  - umap-learn=0.5.9.post2
  - matplotlib
  - seaborn
  - hydra-core=1.3.2
  - omegaconf
  - pyrootutils=1.0.4
  - h5py
  - zarr
  - einops
  - tqdm
  - jupyterlab
  - ipykernel

  # Build tools for the R packages installed from source.
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - make
  - pkg-config
  - hdf5

  # R comparators and their dependencies.
  - r-base=4.5
  - r-remotes
  - r-biocmanager
  - r-matrix
  - r-mgcv
  - r-mclust
  - r-mvtnorm
  - r-pbmcapply
