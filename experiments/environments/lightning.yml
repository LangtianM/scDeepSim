  - r-gamlss
  - r-gamlss.dist
  - r-irlba
  - r-umap
  - r-viridis
  - bioconductor-biocparallel
  - bioconductor-singlecellexperiment
  - bioconductor-summarizedexperiment
  - bioconductor-zinbwave=1.32.0
  - r-assertthat
  - r-digest
  - r-future
  - r-ggdist
  - r-ggforce
  - r-ggplot2
  - r-ggrastr
  - r-ggrepel
  - r-hexbin
  - r-igraph
  - r-leidenbase
  - r-lifecycle
  - r-lme4
  - r-lmtest
  - r-magrittr
  - r-mass
  - r-openssl
  - r-patchwork
  - r-pbapply
  - r-pheatmap
